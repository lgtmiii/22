<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Messages</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;
    background:#f5f5f7;
}


.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#f5f5f7;
}



/* =====================
   iOS 18 HEADER
===================== */


.header{

    position:relative;

    padding-top:
    calc(env(safe-area-inset-top) + 8px);

    height:230px;

    background:
    rgba(245,245,247,.85);

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    z-index:10;

}


/* 뒤로가기 586 */

.back-area{

    position:absolute;

    left:16px;
    top:
    calc(env(safe-area-inset-top) + 12px);

}


.back-pill{

    height:40px;

    padding:
    0 10px 0 12px;

    display:flex;
    align-items:center;

    gap:6px;


    background:#fff;

    border-radius:22px;

    box-shadow:
    0 1px 3px rgba(0,0,0,.08);

}


.back-arrow{

    font-size:30px;

    line-height:20px;

    margin-top:-3px;

}


.number{

    min-width:30px;

    height:22px;

    padding:0 9px;

    border-radius:12px;

    background:#1c1c1e;

    color:#fff;

    font-size:14px;

    display:flex;

    align-items:center;

    justify-content:center;

}





/* 프로필 */

.profile{

    position:absolute;

    top:
    calc(env(safe-area-inset-top) + 55px);

    left:50%;

    transform:translateX(-50%);

    display:flex;

    flex-direction:column;

    align-items:center;

}



.avatar{

    width:80px;

    height:80px;

    border-radius:50%;


    background:

    linear-gradient(
    135deg,
    #b9bcff,
    #727bd6
    );


}



.phone{

    margin-top:12px;

    height:34px;

    min-width:160px;

    padding:0 15px;


    display:flex;

    justify-content:center;

    align-items:center;


    background:#fff;

    border-radius:18px;


    font-size:17px;

    font-weight:700;

}
/* =====================
   MESSAGE AREA
===================== */

.messages{

    flex:1;

    overflow-y:auto;

    padding:
    12px 16px 20px;

    background:#f5f5f7;

    -webkit-overflow-scrolling:touch;

}


.messages::-webkit-scrollbar{
    display:none;
}



.sms-date{

    text-align:center;

    color:#8e8e93;

    font-size:14px;

    line-height:20px;

    margin:8px 0 14px;

}



.message{

    display:flex;

    margin-bottom:10px;

}



.message.other{

    justify-content:flex-start;

}



.bubble{

    max-width:78%;

    padding:
    10px 14px;

    border-radius:18px;

    font-size:16px;

    line-height:1.38;

    letter-spacing:-0.2px;

    word-break:break-word;

}



.bubble.other{

    background:#e5e5ea;

    color:#000;

    border-bottom-left-radius:5px;

}



/* 긴 문자 */

.bubble.other br{

    line-height:1.4;

}
/* =====================
   iOS 18 INPUT BAR
===================== */


.input-area{

    display:flex;

    align-items:center;

    gap:8px;


    padding:
    8px 12px
    calc(8px + env(safe-area-inset-bottom));


    background:
    rgba(245,245,247,.82);


    backdrop-filter:
    blur(25px)
    saturate(180%);


    -webkit-backdrop-filter:
    blur(25px)
    saturate(180%);


    border-top:
    .5px solid rgba(60,60,67,.18);

}




.plus{

    width:32px;

    height:32px;

    flex:none;


    border-radius:50%;


    background:#fff;

    border:
    1px solid rgba(60,60,67,.25);


    color:#8e8e93;


    font-size:25px;

    font-weight:300;


    display:flex;

    align-items:center;

    justify-content:center;

}



.input-wrap{

    position:relative;

    flex:1;

}



.input-box{

    width:100%;

    height:38px;


    border-radius:19px;


    border:
    1px solid rgba(60,60,67,.18);


    background:#fff;


    padding:
    0 42px 0 15px;


    font-size:16px;


    outline:none;

    color:#000;

}



.input-box::placeholder{

    color:#8e8e93;

}



.input-mic{


    position:absolute;


    right:13px;


    top:50%;


    transform:
    translateY(-50%);



    width:18px;

    height:18px;


    opacity:.55;

}



.home-indicator{


    height:
    env(safe-area-inset-bottom);


    background:
    rgba(245,245,247,.82);

}

</style>

</head>


<body>


<div class="app">


<div class="header">


<div class="back-area">

<div class="back-pill">

<span class="back-arrow">‹</span>

<span class="number">
586
</span>

</div>

</div>



<div class="profile">

<div class="avatar"></div>

<div class="phone">
+82 2-6345-9065
</div>

</div>  <!-- profile 닫기 -->


<div class="messages">

        <div class="sms-date">
            문자 메시지 • SMS<br>
            (수요일) 오후 1:37
        </div>


        <div class="message other">
            <div class="bubble other">
                [Web발신]<br>
                [국민연금추납] 5,557,500원 신한<br>
                562-026-80329638 납부<br>
                기한:26.08.31
            </div>
        </div>

    </div>
    <!-- 여기까지 -->


<div class="input-area">

    <div class="plus">
        +
    </div>


    <div class="input-wrap">

        <input 
        class="input-box"
        placeholder="문자 메시지 • SMS">


        <img 
        class="input-mic"
        src="mic.svg">

    </div>


</div>


<div class="home-indicator"></div>

</div>


</body>
</html>
